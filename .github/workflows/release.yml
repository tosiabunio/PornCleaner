name: Prepare release

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Build and create a draft release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PLAYWRIGHT_BROWSERS_PATH: .browsers
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Install Chrome for Testing
        run: npx playwright install --with-deps chromium

      - name: Test the distribution ZIP
        run: npm run test:browser

      - name: Create draft release with installation instructions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG_COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${RELEASE_VERSION}" \
            --jq "map(select(.ref == \"refs/tags/v${RELEASE_VERSION}\")) | length")
          if [ "$RELEASE_TAG_COUNT" -ne 0 ]; then
            echo "::error::This version tag already exists. Review its existing release or choose a new version."
            exit 1
          fi
          gh release create "v${RELEASE_VERSION}" artifacts/porncleaner-chrome.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PornCleaner ${RELEASE_VERSION}" \
            --notes-file artifacts/release-notes.md \
            --draft

      - name: Save browser report and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-test-results
          path: |
            artifacts/browser-test-report.json
            artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14
