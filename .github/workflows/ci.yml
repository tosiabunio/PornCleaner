name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: .browsers
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Install Chrome for Testing
        run: npx playwright install --with-deps chromium

      - name: Test in a disposable browser profile
        run: npm run test:browser

      - name: Save installable ZIP
        uses: actions/upload-artifact@v7.0.1
        with:
          path: artifacts/porncleaner-chrome.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Save browser report and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-test-results
          path: |
            artifacts/browser-test-report.json
            artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14
